<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <title>TaskFlow | Todo App</title>
</head>

<body>

  <div class="background-circle circle-1"></div>
  <div class="background-circle circle-2"></div>

  <main class="container py-5">

    <!-- Hero -->
    <section class="text-center mb-5">

      <h1 class="display-4 fw-bold text-white">
        <i class="fa-solid fa-list-check me-2"></i>
        TaskFlow
      </h1>

      <p class="text-light opacity-75">
        Organize your day and stay productive.
      </p>

    </section>

    <!-- Dashboard -->

    <section class="stats row g-4 mb-5">

      <div class="col-md-4">
        <div class="stat-card">
          <i class="fa-solid fa-list"></i>

          <h2 id="totalTasks">0</h2>

          <span>Total Tasks</span>
        </div>
      </div>

      <div class="col-md-4">
        <div class="stat-card success">

          <i class="fa-solid fa-circle-check"></i>

          <h2 id="completedTasks">0</h2>

          <span>Completed</span>

        </div>
      </div>

      <div class="col-md-4">

        <div class="stat-card warning">

          <i class="fa-solid fa-clock"></i>

          <h2 id="pendingTasks">0</h2>

          <span>Pending</span>

        </div>

      </div>

    </section>

    <!-- Todo Card -->

    <section class="todo-card">

      <div class="row g-3">

        <div class="col-lg-6">

          <input id="taskInput" type="text" class="form-control custom-input" placeholder="What do you need to do?">

        </div>

        <div class="col-lg-3">

          <select id="mySelect" class="form-select custom-input">

            <option value="all">All Tasks</option>
            <option value="completed">Completed</option>
            <option value="uncompleted">Pending</option>

          </select>

        </div>

        <div class="col-lg-3">

          <button id="todo-button" class="btn add-btn w-100">

            <i class="fa-solid fa-plus me-2"></i>

            Add Task

          </button>

        </div>

        <div class="col-12">

          <input id="searchInput" type="search" class="form-control custom-input" placeholder="Search tasks...">

        </div>

      </div>

    </section>

    <!-- Todos -->

    <section class="mt-5">

      <div id="todos-container" class="row gy-3">

      </div>

    </section>

    <!-- Empty State -->

    <div id="emptyState" class="empty-state d-none">

      <i class="fa-solid fa-clipboard-list"></i>

      <h3>No Tasks Yet</h3>

      <p>Add your first task and start being productive.</p>

    </div>

  </main>

  <script src="js/index2.js"></script>

</body>

</html>
